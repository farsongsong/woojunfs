<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pH 예측기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a18;
    --text2: #6b6b65;
    --accent: #1a6b3a;
    --accent-light: #e4f0e8;
    --radius: 12px;
    --ph-acid: #d85a30;
    --ph-neutral: #1d9e75;
    --ph-base: #185fa5;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --surface: #252523;
      --surface2: #2e2e2b;
      --border: rgba(255,255,255,0.1);
      --text: #f0efe9;
      --text2: #a0a09a;
      --accent: #5DCAA5;
      --accent-light: #04342c;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .logo {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: 500;
    flex-shrink: 0;
  }

  header h1 { font-size: 18px; font-weight: 500; }
  header p { font-size: 13px; color: var(--text2); margin-top: 2px; }

  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 1.5rem;
    align-items: start;
  }

  @media (max-width: 800px) {
    .main { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 1.25rem;
  }

  .section-label {
    font-size: 11px;
    color: var(--text2);
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 1.25rem 0 0.75rem;
    display: flex; align-items: center; gap: 6px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: var(--border);
  }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  .input-group label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 4px;
  }

  .input-group input {
    width: 100%;
    padding: 8px 10px;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s;
  }

  .input-group input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .color-preview {
    width: 100%;
    height: 56px;
    border-radius: 10px;
    border: 0.5px solid var(--border);
    margin-bottom: 1rem;
    transition: background 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  .predict-btn {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 1.25rem;
    font-family: inherit;
  }

  .predict-btn:hover { opacity: 0.9; }
  .predict-btn:active { transform: scale(0.98); }

  .result-card {
    margin-top: 1rem;
    padding: 1.25rem;
    border-radius: 10px;
    border: 0.5px solid var(--border);
    background: var(--surface2);
    display: none;
  }

  .result-card.visible { display: block; }

  .ph-display {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 0.75rem;
  }

  .ph-number {
    font-size: 48px;
    font-weight: 500;
    line-height: 1;
    transition: color 0.3s;
  }

  .ph-label {
    font-size: 14px;
    color: var(--text2);
  }

  .ph-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 0.75rem;
  }

  .ph-bar-wrap {
    position: relative;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: linear-gradient(to right,
      #d85a30 0%, #ef9f27 25%, #639922 45%, #1d9e75 50%, #1d9e75 55%, #185fa5 75%, #534ab7 100%
    );
    margin-bottom: 8px;
  }

  .ph-indicator {
    position: absolute;
    top: -4px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--surface);
    border: 2.5px solid var(--text);
    transform: translateX(-50%);
    transition: left 0.5s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  .ph-scale-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 0.75rem;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 5px 0;
    border-top: 0.5px solid var(--border);
  }

  .info-row span:first-child { color: var(--text2); }

  .right-col { display: flex; flex-direction: column; gap: 1.5rem; }

  .chart-wrap { position: relative; height: 260px; }

  .knn-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 0.5rem;
  }

  .knn-item {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 12px;
  }

  .knn-ph {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .knn-dist { color: var(--text2); font-size: 11px; }

  .knn-color {
    width: 24px; height: 24px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 4px;
    border: 0.5px solid var(--border);
  }

  .examples {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 8px;
    margin-top: 0.5rem;
  }

  .example-btn {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    font-family: inherit;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
  }

  .example-btn:hover {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .example-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    margin: 0 auto 6px;
    border: 0.5px solid var(--border);
  }

  .example-ph { font-size: 13px; font-weight: 500; }
  .example-name { font-size: 11px; color: var(--text2); margin-top: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">pH</div>
  <div>
    <h1>pH 색상 예측기</h1>
    <p>RGB · HSV · Lab 값을 입력하면 pH를 예측합니다</p>
  </div>
</header>

<div class="main">
  <!-- 입력 패널 -->
  <div>
    <div class="card">
      <div class="card-title">색상 값 입력</div>

      <div class="color-preview" id="colorPreview">
        색상 미리보기
      </div>

      <div class="section-label">RGB</div>
      <div class="input-row">
        <div class="input-group">
          <label>R <span style="color:var(--text2)">(0–255)</span></label>
          <input type="number" id="R" min="0" max="255" value="255" oninput="updatePreview()">
        </div>
        <div class="input-group">
          <label>G <span style="color:var(--text2)">(0–255)</span></label>
          <input type="number" id="G" min="0" max="255" value="29" oninput="updatePreview()">
        </div>
        <div class="input-group">
          <label>B <span style="color:var(--text2)">(0–255)</span></label>
          <input type="number" id="B" min="0" max="255" value="33" oninput="updatePreview()">
        </div>
      </div>

      <div class="section-label">HSV</div>
      <div class="input-row">
        <div class="input-group">
          <label>H <span style="color:var(--text2)">(0–360)</span></label>
          <input type="number" id="H" min="0" max="360" value="178" oninput="updatePreview()">
        </div>
        <div class="input-group">
          <label>S <span style="color:var(--text2)">(0–255)</span></label>
          <input type="number" id="S" min="0" max="255" value="226">
        </div>
        <div class="input-group">
          <label>V <span style="color:var(--text2)">(0–255)</span></label>
          <input type="number" id="V" min="0" max="255" value="255">
        </div>
      </div>

      <div class="section-label">Lab</div>
      <div class="input-row">
        <div class="input-group">
          <label>L</label>
          <input type="number" id="L" value="138.46">
        </div>
        <div class="input-group">
          <label>a</label>
          <input type="number" id="La" value="205.71">
        </div>
        <div class="input-group">
          <label>b</label>
          <input type="number" id="Lb" value="185.46">
        </div>
      </div>

      <button class="predict-btn" onclick="predict()">예측하기</button>

      <!-- 결과 -->
      <div class="result-card" id="resultCard">
        <div class="ph-display">
          <span class="ph-number" id="phNumber">—</span>
          <span class="ph-label">pH</span>
        </div>
        <div id="phBadge" class="ph-badge"></div>
        <div class="ph-bar-wrap">
          <div class="ph-indicator" id="phIndicator" style="left:50%"></div>
        </div>
        <div class="ph-scale-labels">
          <span>0 산성</span><span>7 중성</span><span>14 염기성</span>
        </div>
        <div class="info-row">
          <span>색상 기준식 pH</span>
          <span id="theoryPh">—</span>
        </div>
        <div class="info-row">
          <span>예측 방법</span>
          <span>k-NN (k=5)</span>
        </div>
        <div class="info-row">
          <span>학습 데이터</span>
          <span>270개 샘플</span>
        </div>
      </div>
    </div>

    <!-- 예시 버튼 -->
    <div class="card" style="margin-top:1rem">
      <div class="card-title">예시 데이터</div>
      <div class="examples" id="exampleBtns"></div>
    </div>
  </div>

  <!-- 우측 -->
  <div class="right-col">
    <!-- 분포 차트 -->
    <div class="card">
      <div class="card-title">pH별 데이터 분포 (학습 데이터)</div>
      <div class="chart-wrap">
        <canvas id="distChart" role="img" aria-label="pH별 데이터 샘플 수 막대그래프. 각 pH(2~10)마다 30개씩 균일하게 분포.">각 pH 값(2~10)에 30개씩 총 270개 샘플이 있습니다.</canvas>
      </div>
    </div>

    <!-- 가장 가까운 샘플 -->
    <div class="card" id="knnCard" style="display:none">
      <div class="card-title">가장 유사한 데이터 5개</div>
      <div class="knn-grid" id="knnGrid"></div>
    </div>

    <!-- pH별 평균 색상 -->
    <div class="card">
      <div class="card-title">pH별 평균 색상</div>
      <div style="display:flex; gap:4px; margin-top:0.25rem; border-radius:8px; overflow:hidden">
        <div id="phColorBar" style="display:flex; width:100%; height:48px;"></div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text2); margin-top:6px">
        <span>pH 2 (강산성)</span><span>pH 10 (강염기성)</span>
      </div>
    </div>
  </div>
</div>

  {name:'중성',   ph:7, R:79,G:204,B:75,H:59,S:161,V:204,L:186.47,La:68.78,Lb:180.63},
  {name:'약염기', ph:8, R:34,G:174,B:122,H:78,S:205,V:174,L:161.56,La:79.87,Lb:144.73},
  {name:'강염기', ph:10,R:31,G:51,B:193,H:116,S:214,V:193,L:78.18,La:173.26,Lb:53.02},
];

function normalize(data) {
  const n = data.length;
  const mins = Array(9).fill(Infinity), maxs = Array(9).fill(-Infinity);
  for (const r of data) for (let i = 0; i < 9; i++) {
    if (r[i] < mins[i]) mins[i] = r[i];
    if (r[i] > maxs[i]) maxs[i] = r[i];
  }
  return { mins, maxs };
}

const { mins, maxs } = normalize(DB);

function normVal(v, i) {
  const range = maxs[i] - mins[i];
  return range === 0 ? 0 : (v - mins[i]) / range;
}

function dist(a, b) {
  let d = 0;
  for (let i = 0; i < 9; i++) {
    const diff = normVal(a[i], i) - normVal(b[i], i);
    d += diff * diff;
  }
  return Math.sqrt(d);
}

function knn(query, k = 5) {
  const dists = DB.map(row => ({
    d: dist(query, row),
    ph: row[9],
    R: row[0], G: row[1], B: row[2]
  }));
  dists.sort((a, b) => a.d - b.d);
  const top = dists.slice(0, k);
  const phPred = top.reduce((s, x) => s + x.ph, 0) / k;
  return { phPred, top };
}

function theoryPh(R, G, B) {
  const ratio = (R - B) / (R + G + B + 1e-12);
  return Math.max(0, Math.min(14, 7 - 5 * ratio));
}

function updatePreview() {
  const R = +document.getElementById('R').value || 0;
  const G = +document.getElementById('G').value || 0;
  const B = +document.getElementById('B').value || 0;
  const hex = '#' + [R,G,B].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  const lum = 0.299*R + 0.587*G + 0.114*B;
  const preview = document.getElementById('colorPreview');
  preview.style.background = hex;
  preview.style.color = lum > 128 ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.8)';
  preview.textContent = `R:${R} G:${G} B:${B} → ${hex}`;
}

function predict() {
  const R = +document.getElementById('R').value;
  const G = +document.getElementById('G').value;
  const B = +document.getElementById('B').value;
  const H = +document.getElementById('H').value;
  const S = +document.getElementById('S').value;
  const V = +document.getElementById('V').value;
  const L = +document.getElementById('L').value;
  const La = +document.getElementById('La').value;
  const Lb = +document.getElementById('Lb').value;

  const query = [R,G,B,H,S,V,L,La,Lb];
  const { phPred, top } = knn(query, 5);
  const theory = theoryPh(R, G, B);

  const rounded = Math.round(phPred * 10) / 10;

  // 결과 표시
  document.getElementById('resultCard').classList.add('visible');
  document.getElementById('phNumber').textContent = rounded.toFixed(1);
  document.getElementById('phNumber').style.color =
    rounded < 6 ? '#d85a30' : rounded > 8 ? '#185fa5' : '#1d9e75';
  document.getElementById('theoryPh').textContent = theory.toFixed(2);

  const badge = document.getElementById('phBadge');
  if (rounded < 6.5) {
    badge.textContent = '산성';
    badge.style.background = '#faece7'; badge.style.color = '#993c1d';
  } else if (rounded > 7.5) {
    badge.textContent = '염기성';
    badge.style.background = '#e6f1fb'; badge.style.color = '#185fa5';
  } else {
    badge.textContent = '중성에 가까움';
    badge.style.background = '#e1f5ee'; badge.style.color = '#0f6e56';
  }

  const pct = (rounded / 14 * 100).toFixed(1) + '%';
  document.getElementById('phIndicator').style.left = pct;

  // kNN 목록
  document.getElementById('knnCard').style.display = 'block';
  const grid = document.getElementById('knnGrid');
  grid.innerHTML = top.map((x, i) => {
    const hex = '#' + [x.R,x.G,x.B].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
    return `<div class="knn-item">
      <span class="knn-color" style="background:${hex};display:block"></span>
      <div class="knn-ph" style="color:${PH_COLORS[x.ph] || '#888'}">pH ${x.ph}</div>
      <div class="knn-dist">거리 ${x.d.toFixed(3)}</div>
    </div>`;
  }).join('');
}

function fillExample(ex) {
  document.getElementById('R').value = ex.R;
  document.getElementById('G').value = ex.G;
  document.getElementById('B').value = ex.B;
  document.getElementById('H').value = ex.H;
  document.getElementById('S').value = ex.S;
  document.getElementById('V').value = ex.V;
  document.getElementById('L').value = ex.L;
  document.getElementById('La').value = ex.La;
  document.getElementById('Lb').value = ex.Lb;
  updatePreview();
  predict();
}
